[package]
name = "mu-launcher"
version = "0.1.0"
description = "MU Launcher — Unified App Hub"
authors = ["nice2mu"]
edition = "2021"

[lib]
name = "mu_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
